<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Orders — Urbanstyle</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="orders.css" />
    <script src="orders.js" defer></script>
  </head>
  <body class="orders-page">
    <header class="orders-header">
      <a class="wordmark" href="/">urbanstyle<span>®</span></a>
      <a class="text-link" href="/">Back to shop ↗</a>
    </header>
    <main class="orders-main">
      <div class="eyebrow"><span class="eyebrow-line"></span> Private administrator page</div>
      <div class="orders-title">
        <div><h1>Orders <span>&amp; payments.</span></h1><p>Customer and payment records saved in your MySQL database.</p></div>
        <button class="button button-dark" id="refresh-orders" type="button">Refresh <span>↻</span></button>
      </div>
      <p class="orders-message" id="orders-message" role="status" aria-live="polite">Connecting to your shop database…</p>
      <section class="orders-stats" id="orders-stats" aria-label="Shop totals"></section>
      <section class="orders-list-section" aria-labelledby="orders-list-title">
        <div class="orders-list-heading"><h2 id="orders-list-title">Recent orders</h2><span>Latest 200</span></div>
        <div class="orders-list" id="orders-list"></div>
      </section>
    </main>
  </body>
</html>
